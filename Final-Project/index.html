<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Final-Project-ClassicGame</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎮 Arcade Hub</h1>
    <p>Snake Game + Player System</p>
  </header>

  <!-- GRID WRAPPER -->
  <main class="parent">

    <!-- 1. TOP HEADER / GAME TITLE -->
    <div class="div1">
      <h2>Snake Game</h2>

      <div class="game-header">
        <div id="scoreDisplay">Score: 0</div>
        <button id="startGameBtn">Start Game</button>
      </div>
    </div>

    <!-- 2. GAME AREA -->
    <div class="div2">
      <h2>Game Area</h2>

      <div id="gameArea">
        <p>Game will render here</p>
      </div>
    </div>

    <!-- 3. PLAYERS -->
    <div class="div4">
      <h2>Players</h2>

      <input type="text" id="playerName" placeholder="Enter player name">
      <button id="addPlayerBtn">Add Player</button>

      <ul id="playerList"></ul>
    </div>

    <!-- 4. LEADERBOARD -->
    <div class="div5">
      <h2>Leaderboard</h2>

      <div class="controls">
        <button id="sortHigh">Sort High → Low</button>
        <button id="sortLow">Sort Low → High</button>
      </div>

      <ul id="leaderboard"></ul>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
