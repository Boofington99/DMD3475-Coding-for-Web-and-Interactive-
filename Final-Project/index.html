<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Final-Project-ClassicGame</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ================= GRID SETUP ================= */
    .parent {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(8, minmax(80px, auto));
      gap: 10px;
      padding: 10px;
      min-height: 100vh;
      background: #0d0d0d;
    }

    .parent > div {
      padding: 20px;
      border-radius: 10px;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* HEADER / GAME HUD */
    .div1 {
      grid-column: 1 / 6;
      grid-row: 1 / 2;
      background: #1a1a1a;
    }

    .arcade-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .arcade-header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #00ff99;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      width: 100%;
    }

    /* GAME AREA */
    .div2 {
      grid-column: 2 / 5;
      grid-row: 2 / 6;
      background: black;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: #000;
      border: 2px solid #fff;
    }

    /* PLAYERS */
    .div4 {
      grid-column: 1 / 2;
      grid-row: 2 / 6;
      background: #1a1a1a;
    }

    /* LEADERBOARD */
    .div5 {
      grid-column: 5 / 6;
      grid-row: 2 / 6;
      background: #1a1a1a;
    }

    /* FOOTER LEFT */
    .div6 {
      grid-column: 1 / 3;
      grid-row: 6 / 8;
      background: #1a1a1a;
    }

    /* FOOTER RIGHT */
    .div7 {
      grid-column: 3 / 6;
      grid-row: 6 / 8;
      background: #1a1a1a;
    }
  </style>
</head>

<body>

  <!-- GRID WRAPPER -->
  <main class="parent">

    <!-- 1. GAME HEADER + ARCADE TITLE -->
    <div class="div1 arcade-header">

      <h1>🎮 Arcade Hub</h1>
      <p>Snake Game + Player System</p>


      <div class="game-header">
        <div id="scoreDisplay">Score: 0</div>
        <button id="startGameBtn">Start Game</button>
      </div>

    </div>

    <!-- 2. GAME AREA -->
    <div class="div2">
      <h2>Game Area</h2>

      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- GAME OVER TEXT -->
      <div id="gameOverText" style="display:none; margin-top:15px; color:red; font-size:28px; font-weight:bold;">
        GAME OVER
      </div>
    </div>

    <!-- 3. PLAYERS -->
    <div class="div4">
      <h2>Players</h2>

      <input type="text" id="playerName" placeholder="Enter player name">
      <button id="addPlayerBtn">Add Player</button>

      <input type="text" id="searchBox" placeholder="Search players">

      <ul id="playerList"></ul>
    </div>

    <!-- 4. LEADERBOARD -->
    <div class="div5">
      <h2>Leaderboard</h2>

      <div class="controls">
        <button id="sortHigh">Sort High → Low</button>
        <button id="sortLow">Sort Low → High</button>
      </div>

      <ul id="leaderboard"></ul>
    </div>

    <!-- 5. INSTRUCTIONS -->
    <div class="div6">
      <h2>Instructions</h2>
      <p>Use WASD or arrow keys (if enabled) to move the snake. Eat food to grow and increase score.</p>
    </div>

    <!-- 6. STATS
    <div class="div7">
      <h2>Stats</h2>
      <p>Track high scores and player performance here.</p>
    </div> -->

  </main>

  <script src="app.js"></script>

</body>
</html>
